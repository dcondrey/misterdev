name: Release

# Publishes to PyPI on a version tag using Trusted Publishing (OIDC) — no
# long-lived token is stored. Configure the publisher once at
# https://pypi.org/manage/project/misterdev/settings/publishing/
#   owner: dcondrey, repo: misterdev, workflow: release.yml, environment: pypi

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Gated: enable by setting the repo variable PYPI_ENABLED=true AFTER you have
    # configured PyPI Trusted Publishing (see the comment at the top of this
    # file). Until then a tag builds + tests but does not attempt to publish, so
    # a release never red-fails on an unconfigured publisher.
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Publish metadata to the official MCP Registry via the workflow OIDC token
      # (id-token: write, granted above). server.json's version is stamped from
      # the release tag so it matches the PyPI package the registry verifies against.
      - name: Publish to MCP Registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json'));s.version='${VERSION}';s.packages.forEach(p=>p.version='${VERSION}');fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
