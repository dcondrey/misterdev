name: Release

# Publishes to PyPI on a version tag using Trusted Publishing (OIDC) — no
# long-lived token is stored. Configure the publisher once at
# https://pypi.org/manage/project/misterdev/settings/publishing/
#   owner: dcondrey, repo: misterdev, workflow: release.yml, environment: pypi

on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Gated: enable by setting the repo variable PYPI_ENABLED=true AFTER you have
    # configured PyPI Trusted Publishing (see the comment at the top of this
    # file). Until then a tag builds + tests but does not attempt to publish, so
    # a release never red-fails on an unconfigured publisher.
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    environment: pypi
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      # Publish metadata to the official MCP Registry via the workflow OIDC token
      # (id-token: write, granted above). server.json's version is stamped from
      # the release tag so it matches the PyPI package the registry verifies against.
      - name: Publish to MCP Registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "ERROR: GITHUB_REF_NAME '${GITHUB_REF_NAME}' did not yield a valid version"
            exit 1
          fi
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json'));s.version='${VERSION}';s.packages.forEach(p=>p.version='${VERSION}');fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          rm mcp-publisher.tar.gz
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
