[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-project-orchestrator"
version = "0.1.0"
description = "A modular and extensible framework to automate development workflows."
readme = "README.md"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
]

[project.optional-dependencies]
topography = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
]

[tool.setuptools.packages.find]
include = ["my_project_orchestrator*"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[project.scripts]
project-orchestrator = "my_project_orchestrator.cli:main"
