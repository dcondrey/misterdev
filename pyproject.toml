[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-project-orchestrator"
version = "0.1.0"
description = "A modular and extensible framework to automate development workflows."
readme = "README.md"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "python-frontmatter>=1.0.0",
    "rich>=13.0.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-c>=0.24.1",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-swift>=0.7.0",
    "tree-sitter-c-sharp>=0.23.1",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-kotlin>=1.1.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
topography = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
]
# Local, offline embeddings for semantic context ranking (no API key). Heavy
# (pulls onnxruntime); enable when you want dense ranking without OpenRouter.
local-embeddings = [
    "fastembed>=0.3.0",
]
# Optional LSP semantic-diagnostics gate (orchestrator.lsp_diagnostics). Needs
# the per-language server available; off by default and timeout-bounded.
lsp = [
    "multilspy>=0.0.1",
]

[tool.setuptools.packages.find]
include = ["my_project_orchestrator*"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[project.scripts]
project-orchestrator = "my_project_orchestrator.cli:main"
